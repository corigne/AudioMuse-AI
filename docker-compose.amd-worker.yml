# AMD GPU worker -- docker compose example
#
# Runs AudioMuse-AI RQ workers using the ROCm/MIGraphX image.
# Inference runs on the AMD GPU via MIGraphXExecutionProvider.
#
# Prerequisites:
#   - ROCm driver installed on the host (ROCm 6.x or 7.x)
#   - User in the `video` and `render` groups
#   - audiomuse-ai:rocm image built:
#       docker build -f Dockerfile.rocm -t audiomuse-ai:rocm .
#
#   Optional extras (add build args to enable):
#       --build-arg WITH_FASTER_WHISPER=1       # faster-whisper lyrics backend
#       --build-arg WITH_ESSENTIA_MOOD_MODELS=1 # Essentia mood classifiers
#
# Usage:
#   docker compose -f docker-compose.amd-worker.yml up -d --scale audiomuse-worker=3

services:
  audiomuse-worker:
    image: audiomuse-ai:rocm
    restart: unless-stopped
    environment:
      SERVICE_TYPE: worker
      # localhost resolves to the container itself, not the host.
      # These MUST be set to the address of your AudioMuse server.
      REDIS_URL: ${REDIS_URL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-audiomuse}
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USE_GPU_CLUSTERING: "false"   # cuML GPU clustering is NVIDIA-only
      #
      # Performance: disable per-song model reload (2-3s overhead per track).
      # The upstream default (true) is conservative for low-RAM/VRAM homelab hardware.
      # With a GPU that has adequate VRAM, album-end recycling is faster with no stability
      # penalty. Increase SESSION_RECYCLE_INTERVAL (e.g. 50) if you see VRAM growth.
      PER_SONG_MODEL_RELOAD: "false"
      SESSION_RECYCLE_INTERVAL: "0"   # 0 = recycle at album end only
      #
      # Override gfx version if your card is not auto-detected.
      # RDNA 3 (RX 7000 series):  HSA_OVERRIDE_GFX_VERSION=11.0.0
      # RDNA 2 (RX 6000 series):  HSA_OVERRIDE_GFX_VERSION=10.3.0
      # HSA_OVERRIDE_GFX_VERSION: "11.0.0"
      #
      # --- Optional: faster-whisper lyrics transcription backend ---
      # Requires: image built with --build-arg WITH_FASTER_WHISPER=1
      # LYRICS_WHISPER_MODEL_DIR: "/app/model/faster-whisper-small"
      #
      # --- Optional: Essentia MTG-Jamendo mood classifiers ---
      # WARNING: Essentia models are licensed for non-commercial use only (CC BY-NC 4.0).
      # Using them in a commercial deployment may conflict with AGPLv3.
      # Personal/homelab use only.
      # Requires: image built with --build-arg WITH_ESSENTIA_MOOD_MODELS=1
      # USE_ESSENTIA_MOOD_MODELS: "1"
      # ESSENTIA_MOOD_MODEL_DIR: "/app/model/essentia-mood"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    shm_size: "2gb"
